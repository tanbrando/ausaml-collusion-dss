version: "3.9"

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./aml_dss.db
      - USE_MOCK_ENGINE=true
      - DEFAULT_MODEL_ID=hybrid_v3_best
      - CORS_ORIGINS=http://localhost:3000
    volumes:
      - ./backend:/app
      - ./models:/app/models
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
